name: Static release checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run audit:files
      - run: git diff --exit-code -- cache-manifest.js docs/distribution-manifest.json
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - run: npm run test:pwa
      - run: npm run test:audio-browser
      - run: npm run test:music-render
      - run: npm run test:setup-browser
      - run: npm run test:experience-browser
      - run: npm run test:record-browser
      - run: npm run test:camera-mask-browser
      - name: Preserve browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-checks-${{ github.run_attempt }}
          path: |
            test-results/*.json
            test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
